[package]
name        = "libharfbuzz-sys"
version     = "0.1.0"
description = "Bindings over libharfbuzz, the HarfBuzz text shaping engine: the blob, the face, the font, the buffer, the shaping call with its features, the glyph information and position arrays, and the string forms of the tags, directions, scripts and languages, one declaration per C entry point."
license     = "Apache-2.0"

# NOT a `0.0.x` draft.  An interface release is the shape whose every
# `pub fn` body is a `todo()`, and every `pub fn` here is an `@ffi`
# declaration with no body at all — `novo pkg publish` reads that as a
# release with bodies and refuses a `0.0.x` version for it.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libharfbuzz.
layer       = "sys"

category    = "bindings"

# The one C library.  `libharfbuzz.so` is what the loader resolves these
# symbols against; installing this package does not install it.
wraps       = "libharfbuzz"

tags        = ["ffi", "harfbuzz", "shaping", "text", "opentype", "font", "bindings"]
repository  = "https://github.com/novolang/libharfbuzz-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libharfbuzz, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "harfbuzz"` name every declaration in
# `src/` carries.  `libharfbuzz-dev` installs
# `/usr/lib/<arch>/pkgconfig/harfbuzz.pc`, so pkg-config answers
# `-lharfbuzz` on Debian and Ubuntu.  Without the block the default is
# `-lharfbuzz`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.harfbuzz]
pkg_config = "harfbuzz"
